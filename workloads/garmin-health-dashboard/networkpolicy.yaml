apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garmin-health-dashboard
  namespace: garmin-health-dashboard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garmin-health-dashboard
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
