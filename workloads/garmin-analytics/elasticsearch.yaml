apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garmin-elasticsearch
spec:
  serviceName: garmin-elasticsearch
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: garmin-elasticsearch}
  template:
    metadata:
      labels: {app.kubernetes.io/name: garmin-elasticsearch}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
          env:
            - {name: discovery.type, value: single-node}
            - {name: cluster.name, value: garmin-analytics}
            - {name: node.name, value: garmin-elasticsearch-0}
            - {name: xpack.security.enabled, value: "false"}
            - {name: xpack.security.http.ssl.enabled, value: "false"}
            - {name: xpack.ml.enabled, value: "false"}
            - {name: ingest.geoip.downloader.enabled, value: "false"}
            - {name: bootstrap.memory_lock, value: "false"}
            - {name: ES_JAVA_OPTS, value: "-Xms1g -Xmx1g -XX:MaxDirectMemorySize=512m"}
          ports:
            - {name: http, containerPort: 9200}
          volumeMounts:
            - {name: data, mountPath: /usr/share/elasticsearch/data}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: "/_cluster/health?wait_for_status=yellow", port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: "/_cluster/health?wait_for_status=yellow", port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 1536Mi}
            limits: {cpu: "2", memory: 2304Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: garmin-elasticsearch}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: garmin-elasticsearch
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: garmin-elasticsearch}
  ports:
    - {name: http, port: 9200, targetPort: http}
