apiVersion: batch/v1
kind: Job
metadata:
  name: garmin-provision
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: garmin-provision}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: provision
          image: curlimages/curl:8.15.0
          command: [/bin/sh, /provision/provision.sh]
          volumeMounts:
            - {name: provision, mountPath: /provision, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: provision
          configMap: {name: garmin-provisioning, defaultMode: 0555}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
