apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmin-analytics-collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: garmin-analytics-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garmin-analytics-collector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: garmin-health-dashboard:local-20260808-elk4
          imagePullPolicy: Never
          command: [python, -m, app.collector]
          env:
            - {name: GARMIN_DATA_DIR, value: /data}
            - {name: GARMIN_TOKEN_SECRET_DIR, value: /secrets/garmin}
            - {name: GARMIN_POLL_SECONDS, value: "900"}
            - {name: GARMIN_MAX_BACKOFF_SECONDS, value: "3600"}
            - {name: GARMIN_REFRESH_WINDOW_DAYS, value: "3"}
            - {name: GARMIN_MAX_DAYS_PER_RUN, value: "400"}
            - {name: GARMIN_MAX_NEW_FIT_PER_RUN, value: "0"}
            - {name: GARMIN_DOWNLOAD_FIT, value: "false"}
          volumeMounts:
            - {name: dashboard-data, mountPath: /data}
            - {name: spool, mountPath: /data/analytics}
            - {name: tokens, mountPath: /secrets/garmin, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            exec:
              command: [python, -c, "import os; os.kill(1, 0)"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [python, -c, "import os; os.kill(1, 0)"]
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [python, -c, "import os; os.kill(1, 0)"]
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:4.0.11
          args: [-c, /fluent-bit/etc/fluent-bit.conf]
          ports:
            - {name: metrics, containerPort: 2020}
          volumeMounts:
            - {name: spool, mountPath: /data/analytics}
            - {name: fluent-buffer, mountPath: /data/fluent-bit}
            - {name: fluent-config, mountPath: /fluent-bit/etc, readOnly: true}
          securityContext: *restricted
          startupProbe:
            httpGet: {path: /api/v1/health, port: metrics}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/v1/health, port: metrics}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /api/v1/health, port: metrics}
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 160Mi}
      volumes:
        - name: dashboard-data
          persistentVolumeClaim: {claimName: garmin-data}
        - name: spool
          persistentVolumeClaim: {claimName: garmin-analytics-spool}
        - name: fluent-buffer
          persistentVolumeClaim: {claimName: garmin-fluent-bit-buffer}
        - name: tokens
          secret: {secretName: garmin-tokens, defaultMode: 0400}
        - name: fluent-config
          configMap: {name: garmin-fluent-bit}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: garmin-fluent-bit-metrics
spec:
  selector: {app.kubernetes.io/name: garmin-analytics-collector}
  ports:
    - {name: http, port: 2020, targetPort: metrics}
