input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  if ![_id] or ![event][dataset] or ![event][action] {
    mutate {
      add_field => { "[event][dataset]" => "garmin.dead_letter" }
      replace => { "[event][kind]" => "pipeline_error" }
      replace => { "[event][action]" => "upsert" }
      add_tag => ["invalid_envelope"]
    }
    fingerprint {
      source => "message"
      target => "_id"
      method => "SHA256"
    }
  }
  ruby {
    code => '
      dataset = event.get("[event][dataset]").to_s.downcase.gsub(/[^a-z0-9_-]+/, "-")
      event.set("[@metadata][target_index]", dataset.start_with?("garmin-") ? dataset : "garmin-#{dataset.sub(/^garmin-?/, "")}")
      event.set("[@metadata][es_action]", event.get("[event][action]") == "delete" ? "delete" : "update")
      event.set("[@metadata][document_id]", event.get("_id"))
      event.remove("_id")
    '
  }
}

output {
  elasticsearch {
    hosts => ["http://garmin-elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
    document_id => "%{[@metadata][document_id]}"
    action => "%{[@metadata][es_action]}"
    doc_as_upsert => true
    retry_initial_interval => 2
    retry_max_interval => 60
  }
}
