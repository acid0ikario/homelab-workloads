input {
  http {
    port => 8080
    codec => json
    response_code => 200
  }
}

filter {
  # Build a stable fallback from the canonical complete payload, never from a
  # usually-absent `message` field. HTTP transport data lives in @metadata and
  # therefore does not affect the identifier.
  if ![_id] {
    ruby {
      init => 'require "digest"; require "json"'
      code => '
        canonicalize = lambda do |value|
          case value
          when Hash
            value.keys.sort.each_with_object({}) { |key, out| out[key] = canonicalize.call(value[key]) }
          when Array
            value.map { |item| canonicalize.call(item) }
          else
            value
          end
        end
        event.set("_id", Digest::SHA256.hexdigest(JSON.generate(canonicalize.call(event.to_hash))))
      '
    }
  }
  if ![event][dataset] {
    mutate {
      add_field => { "[event][dataset]" => "garmin.dead_letter" }
      replace => { "[event][kind]" => "pipeline_error" }
      add_tag => ["invalid_envelope"]
    }
  }
  if ![event][action] {
    mutate { add_field => { "[event][action]" => "upsert" } }
  }
  ruby {
    code => '
      dataset = event.get("[event][dataset]").to_s.downcase.gsub(/[^a-z0-9_-]+/, "-")
      event.set("[@metadata][target_index]", dataset.start_with?("garmin-") ? dataset : "garmin-#{dataset.sub(/^garmin-?/, "")}")
      event.set("[@metadata][es_action]", event.get("[event][action]") == "delete" ? "delete" : "index")
      event.set("[@metadata][document_id]", event.get("_id"))
      event.remove("_id")
    '
  }
}

output {
  elasticsearch {
    hosts => ["http://garmin-elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
    document_id => "%{[@metadata][document_id]}"
    action => "%{[@metadata][es_action]}"
    retry_initial_interval => 2
    retry_max_interval => 60
  }
}
