[SERVICE]
    Flush                     5
    Grace                     30
    Log_Level                 info
    Parsers_File              /fluent-bit/etc/parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    storage.path              /data/analytics/fluent-bit/buffers
    storage.sync              full
    storage.checksum          on
    storage.backlog.mem_limit 16M
    storage.metrics           on

[INPUT]
    Name              tail
    Tag               garmin.analytics
    Path              /data/analytics/spool/garmin.ndjson
    Parser            garmin_json
    DB                /data/analytics/fluent-bit/tail.db
    DB.sync           full
    Read_from_Head    true
    Refresh_Interval  5
    Rotate_Wait       30
    storage.type      filesystem
    Buffer_Chunk_Size 64K
    Buffer_Max_Size   1M
    Skip_Long_Lines   on

[OUTPUT]
    Name                  tcp
    Match                 garmin.analytics
    Host                  garmin-logstash
    Port                  5044
    Format                json_lines
    Retry_Limit           False
    storage.total_limit_size 1536M
    net.keepalive         on
