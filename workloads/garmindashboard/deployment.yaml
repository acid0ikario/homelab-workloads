apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmindashboard
  labels:
    app: garmindashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garmindashboard
  template:
    metadata:
      labels:
        app: garmindashboard
    spec:
      containers:
        - name: garmindashboard
          image: ghcr.io/acid0ikario/garmindashboard:latest  # CI bumps this tag via PR
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
