apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.11.3
    helm:
      values: |
        controller:
          service:
            type: LoadBalancer
          config:
            # Trust the X-Forwarded-For chain coming from the Tailscale Funnel / k3d LB
            use-forwarded-headers: "true"
            compute-full-forwarded-for: "true"
            # k3d/tailscale hops live in the pod/service CIDRs — trust them so the
            # real client IP (left-most XFF entry) becomes $remote_addr.
            proxy-real-ip-cidr: "10.42.0.0/16,10.43.0.0/16,127.0.0.1/32"
            # Structured JSON access logs with everything extractable per request.
            log-format-escape-json: "true"
            log-format-upstream: >-
              {"time":"$time_iso8601","remote_addr":"$remote_addr",
              "x_forwarded_for":"$http_x_forwarded_for",
              "x_original_forwarded_for":"$http_x_original_forwarded_for",
              "realip":"$realip_remote_addr",
              "host":"$host","method":"$request_method","path":"$uri",
              "query":"$args","status":$status,
              "body_bytes":$body_bytes_sent,"request_time":$request_time,
              "upstream_status":"$upstream_status",
              "user_agent":"$http_user_agent","referer":"$http_referer",
              "accept_language":"$http_accept_language",
              "protocol":"$server_protocol","scheme":"$scheme",
              "tailscale_funnel":"$http_tailscale_funnel_request",
              "namespace":"$namespace","ingress":"$ingress_name",
              "service":"$service_name"}
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
