apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garmindashboard
  namespace: workloads
spec:
  ingressClassName: nginx
  rules:
    - host: garmindashboard.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garmindashboard
                port:
                  number: 80
