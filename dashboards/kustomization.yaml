apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

# Wrap the dashboard JSON in a ConfigMap the Grafana sidecar auto-loads.
configMapGenerator:
  - name: grafana-dashboard-ingress-access-logs
    files:
      - ingress-access-logs.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: "/tmp/dashboards/homelab"
